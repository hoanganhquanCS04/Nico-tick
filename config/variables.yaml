# Danh mục biến chuẩn hoá - xương sống của cả dự án (spec P0-1 mục 5).
#
# File này là giao ước giữa 4 mô-đun:
#   - prompts.jsonl  : danh sách biến hợp lệ đưa cho mô hình
#   - validator      : kiểm tra biến mô hình sinh ra có tồn tại không
#   - P4             : sinh ~150 công thức trên đúng danh mục này
#   - P5             : tính giá trị biến từ BCTC quý
#
# Khoá chính là cặp (statement, vas_code) - mã số chỉ tiêu theo mẫu BCTC Việt Nam.
# MÃ SỐ VA NHAU GIỮA CÁC BÁO CÁO: mã 20 là "lợi nhuận gộp" ở KQKD nhưng là "lưu chuyển
# tiền thuần từ HĐKD" ở LCTT; mã 02 là "giảm trừ doanh thu" ở KQKD nhưng là "khấu hao"
# ở LCTT. Vì vậy luôn phải xác định báo cáo trước, không tra mã số trần.
#
# aliases chỉ là phương án dự phòng cho dòng OCR mất mã số.
# coverage do src/data/build_variables.py điền, KHÔNG sửa tay.

meta:
  version: 0
  created: 2026-09-23
  sample: data/sample/tickers.csv   # 20 mã x 2 năm
  note: >
    applies_to=[non_financial] nghĩa là biến chỉ có ở doanh nghiệp thường.
    Ngân hàng và công ty chứng khoán dùng mẫu biểu riêng (VCB chỉ 28-31 mã số,
    SHB 38-49, so với trung vị 74 của nhóm phi tài chính) nên nhiều biến sẽ trống -
    đó là kết quả đúng, không phải lỗi parser.

